[test]
scanner = "fast_scanner"
amplitude = "1 deg"
final_amplitude = "0 deg"


[devices.fast_scanner]
category = "scanners"
driver = "nidaq_resonant"

[devices.fast_scanner.identity]
manufacturer = "Cambridge Technologies"
model = "CRS8K"

[devices.fast_scanner.config]
amplitude_control_channel = "Dev1/ao0"
command_voltage_range = {min = "0 V", max = "5 V"}
nominal_frequency = "7.91 kHz"
max_amplitude = "26 deg"
settling_time = "100 ms"
frequency_tolerance = 0.003


[test.galvo]
sample_rate = "1 kS/s"
timeout = "2 s"

[[test.galvo.axes]]
scanner = "galvo_x"
samples = ["0 deg", "0.05 deg", "0.1 deg", "0.05 deg", "0 deg"]
final_angle = "0 deg"

[[test.galvo.axes]]
scanner = "galvo_y"
samples = ["0 deg", "-0.05 deg", "-0.1 deg", "-0.05 deg", "0 deg"]
final_angle = "0 deg"


[devices.galvo_x]
category = "scanners"
driver = "nidaq_galvo"

[devices.galvo_x.config]
angle_control_channel = "Dev1/ao1"
angle_range = {min = "-10 deg", max = "10 deg"}
command_voltage_range = {min = "-5 V", max = "5 V"}
inverted = false


[devices.galvo_y]
category = "scanners"
driver = "nidaq_galvo"

[devices.galvo_y.config]
angle_control_channel = "Dev1/ao2"
angle_range = {min = "-10 deg", max = "10 deg"}
command_voltage_range = {min = "-5 V", max = "5 V"}
inverted = false

[devices.digitizer]
category = "digitizers"
driver = "nidaq"

[devices.digitizer.config]
physical_channels = "Dev1/ai0:1"


[test.synchronized]
digitizer = "digitizer"
scanner = "galvo_x"

sample_rate = "1 kS/s"
record_length = 32
records_per_batch = 2
batch_count = 2
channel_indices = [0, 1]
input_voltage_range = {min = "-5 V", max = "5 V"}
terminal_config = "DIFF"

command_angle = "0 deg"
final_angle = "0 deg"
timeout = "2 s"


# Supply running TTL record triggers at the Alazar external-trigger input.
# Connect its software-configurable AUX output to the NI input named below.
# The test selects acquisition-active AUX output and holds a constant angle.

[test.triggered_frame]
digitizer = "alazar_digitizer"
scanner = "galvo_x"
acquisition_active_input = "/Dev1/PFI0"

sample_rate = "100 MS/s"
record_length = 4096
records_per_batch = 2
batch_count = 4
channel_indices = [0, 1]
input_voltage_range = {min = "-1 V", max = "1 V"}
input_impedance = "50 ohm"
input_coupling = "DC"
trigger_edge = "rising"
dma_buffer_count = 4

ao_sample_rate = "20 kS/s"
ao_sample_count = 100
command_angle = "0 deg"
final_angle = "0 deg"
settling_time = "100 ms"
timeout = "5 s"