name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Check out dirigo-nidaq
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Require the Dirigo development revision
        if: vars.DIRIGO_REF == ''
        shell: python
        run: |
          raise SystemExit(
              "Set repository variable DIRIGO_REF to the Dirigo v0.4 branch or commit."
          )

      - name: Check out Dirigo
        uses: actions/checkout@v7
        with:
          repository: dirigo-developers/dirigo
          ref: ${{ vars.DIRIGO_REF }}
          path: dirigo

      - name: Install Dirigo
        run: python -m pip install -e ../dirigo

      - name: Install dirigo-nidaq and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check types
        run: ty check

      - name: Run tests
        run: python -m pytest
